    "/v1/admin/git/operation": {"servers": [{"url": "https://{authority}", "variables": {"authority": {"default": "worker.example.invalid", "description": "Use the approved interface address and port of the pinned worker."}}}], "post": {"x-phase": "worker", "summary": "Start, poll or cancel an administrator-owned worker job", "security": [{"mutualTLS": [], "workerBearer": []}], "responses": {"200": {"description": "Start, poll or cancel an administrator-owned worker job", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitWorkerStatus"}}}}, "default": {"description": "Worker rejected the request", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitWorkerError"}}}}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitWorkerRequest"}}}}}},
