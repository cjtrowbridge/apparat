  "components": {
    "securitySchemes": {"mutualTLS": {"type": "mutualTLS"}, "workerBearer": {"type": "http", "scheme": "bearer", "description": "Short-lived session bound to the verified client device."}},
    "parameters": {
      "ID": {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}},
      "ProjectID": {"name": "project_id", "in": "path", "required": true, "schema": {"type": "string"}},
      "TaskID": {"name": "task_id", "in": "path", "required": true, "schema": {"type": "string"}},
      "QueueID": {"name": "queue_id", "in": "path", "required": true, "schema": {"type": "string"}},
      "LeaseID": {"name": "lease_id", "in": "path", "required": true, "schema": {"type": "string"}},
      "ServiceID": {"name": "service_id", "in": "path", "required": true, "schema": {"type": "string"}},
      "ArtifactID": {"name": "artifact_id", "in": "path", "required": true, "schema": {"type": "string"}},
      "IdempotencyKey": {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string"}}
    },
    "schemas": {
      "GitWorkerError": {"type": "object", "properties": {"error": {"type": "string"}}, "required": ["error"]},
      "GitWorkerProject": {"type": "object", "properties": {"ID": {"type": "string"}, "Name": {"type": "string"}, "Location": {"type": "string"}, "Branch": {"type": "string"}, "Revision": {"type": "string"}, "Available": {"type": "boolean"}}, "required": ["ID", "Name", "Location", "Branch", "Revision", "Available"]},
      "GitProvider": {"type": "object", "properties": {"ID": {"type": "string"}, "Name": {"type": "string"}, "Tool": {"type": "string"}, "Reason": {"type": "string"}, "Installed": {"type": "boolean"}, "CanInstall": {"type": "boolean"}, "CanEnroll": {"type": "boolean"}, "Accounts": {"type": ["array", "null"], "items": {"type": "string"}}}, "required": ["ID", "Name", "Tool", "Installed", "CanInstall", "CanEnroll", "Accounts", "Reason"]},
      "GitWorkerRequest": {"type": "object", "properties": {"ID": {"type": "string", "description": "Client-generated canonical ULID, reused for status, cancel and retries."}, "Operation": {"enum": ["install", "enroll", "clone", "status", "cancel"]}, "Provider": {"enum": ["github"]}, "Repo": {"type": "string"}, "Account": {"type": "string"}}, "required": ["ID", "Operation", "Provider"]},
      "GitWorkerStatus": {"type": "object", "properties": {"State": {"enum": ["pending", "completed", "failed"]}, "Message": {"type": "string"}, "Code": {"type": "string"}, "Username": {"type": "string"}, "Project": {"anyOf": [{"$ref": "#/components/schemas/GitWorkerProject"}, {"type": "null"}]}}, "required": ["State", "Message", "Code", "Username", "Project"]},
      "WorkloadClass": {"type": "string", "enum": ["text_generation", "image_generation", "video_generation", "speech_to_text", "text_to_speech", "research_boinc"]},
      "DriverKind": {
        "type": "string",
        "description": "Statically registered provider protocol; not a concrete service-instance identity",
        "examples": ["ollama", "openai_compatible", "llama_cpp", "automatic1111", "comfyui"]
      },
      "ServiceProjection": {
        "type": "object",
        "required": ["service_id", "owner_device_id", "driver_kind", "revision", "observed_at", "expires_at"],
        "properties": {
          "service_id": {"type": "string"},
          "owner_device_id": {"type": "string"},
          "driver_kind": {"$ref": "#/components/schemas/DriverKind"},
          "display_name": {"type": "string"},
          "health": {"type": "string"},
          "revision": {"type": "integer", "minimum": 0},
          "observed_at": {"type": "integer", "description": "UTC milliseconds"},
          "expires_at": {"type": "integer", "description": "UTC milliseconds; expired services are not routable"},
          "capabilities": {"type": "array", "items": {"$ref": "#/components/schemas/CapabilityProjection"}}
        },
        "description": "Never contains a provider-local endpoint, credential reference, token, prompt, or result"
      },
      "CapabilityProjection": {
        "type": "object",
        "required": ["capability_id", "service_id", "workload_class", "schema_version"],
        "properties": {
          "capability_id": {"type": "string"},
          "service_id": {"type": "string"},
          "workload_class": {"$ref": "#/components/schemas/WorkloadClass"},
          "schema_version": {"type": "string"},
          "model_id": {"type": "string"},
          "features": {"type": "array", "items": {"type": "string"}},
          "limits": {"type": "object", "additionalProperties": true}
        }
      },
      "ArtifactMetadata": {
        "type": "object",
        "required": ["artifact_id", "owner_device_id", "sha256", "size", "mime_type"],
        "properties": {
          "artifact_id": {"type": "string"},
          "owner_device_id": {"type": "string"},
          "sha256": {"type": "string", "pattern": "^[a-f0-9]{64}$"},
          "size": {"type": "integer", "minimum": 0},
          "mime_type": {"type": "string"},
          "expires_at": {"type": "integer", "description": "Optional UTC milliseconds"}
        }
      },
      "LocalHealth": {
        "type": "object",
        "additionalProperties": false,
        "properties": {"version": {"type": "string"}, "state": {"type": "string", "enum": ["starting", "ready", "stopping", "stopped", "failed"]}, "ready": {"type": "boolean"}},
        "required": ["version", "state", "ready"]
      },
      "LocalDevice": {
        "type": "object",
        "additionalProperties": false,
        "properties": {"os": {"type": "string"}, "architecture": {"type": "string"}, "identity_status": {"type": "string"}},
        "required": ["os", "architecture", "identity_status"]
      },
      "LocalCapability": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {"type": "string", "pattern": "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"},
          "service_id": {"type": "string", "pattern": "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"},
          "workload_class": {"type": "string", "enum": ["text_generation", "image_generation"]}
        },
        "required": ["id", "service_id", "workload_class"]
      },
      "LocalService": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {"type": "string", "pattern": "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"},
          "name": {"type": "string", "maxLength": 80},
          "driver": {"type": "string", "enum": ["mock-text", "mock-image"]},
          "enabled": {"type": "boolean"},
          "revision": {"type": "integer", "minimum": 1},
          "health": {"type": "string", "enum": ["unknown", "disabled", "healthy", "unhealthy", "stale"]},
          "observed_at_ms": {"type": "integer"},
          "error": {"type": "string", "enum": ["probe_failed"]},
          "capabilities": {"type": "array", "items": {"$ref": "#/components/schemas/LocalCapability"}}
        },
        "required": ["id", "name", "driver", "enabled", "revision", "health", "observed_at_ms", "capabilities"]
      },
      "LocalError": {"type": "object", "additionalProperties": false, "properties": {"error": {"type": "string"}}, "required": ["error"]}
    }
  }
}
