    "/v1/admin/git/accounts": {"servers": [{"url": "https://{authority}", "variables": {"authority": {"default": "worker.example.invalid", "description": "Use the approved interface address and port of the pinned worker."}}}], "get": {"x-phase": "worker", "summary": "List saved GitHub usernames", "security": [{"mutualTLS": [], "workerBearer": []}], "responses": {"200": {"description": "List saved GitHub usernames", "content": {"application/json": {"schema": {"type": "object", "properties": {"usernames": {"type": ["array", "null"], "items": {"type": "string"}}}, "required": ["usernames"]}}}}, "default": {"description": "Worker rejected the request", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitWorkerError"}}}}}}},
