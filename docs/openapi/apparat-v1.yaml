    "title": "Apparat API",
    "version": "0.1.0",
    "description": "Phase 8 implements only the six read-only loopback operations marked x-phase: 8. Worker Git operations use a separate granted TLS listener, pinned worker identity and device-bound administrator session. Operations marked future are planned."
