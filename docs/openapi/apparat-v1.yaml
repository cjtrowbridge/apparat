    "/v1/workspace/catalog": {"servers": [{"url": "https://{authority}", "variables": {"authority": {"default": "worker.example.invalid", "description": "Use the approved interface address and port of the pinned worker."}}}], "get": {"x-phase": "worker", "summary": "Page through visible registered worker checkouts", "security": [{"mutualTLS": [], "workerBearer": []}], "responses": {"200": {"description": "Up to 32 project summaries and an optional NextCursor"}, "403": {"description": "Access denied"}}, "parameters": [{"in": "query", "name": "before", "schema": {"type": "string"}}]}},
